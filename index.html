<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dani · Diseño de marca y web</title>
  <meta name="description" content="Web Pocket: una mini web hecha a tu medida, con chat inteligente, visión 360° / 3D y ventas directas por WhatsApp.">
  <meta name="theme-color" content="#0f0820">
  <meta property="og:title" content="Dani · Diseño de marca y web">
  <meta property="og:description" content="Mucho más que un link en bio. Mira las Web Pocket que he creado.">
  <!-- 👉 TIPOGRAFÍA: si cambias las fuentes, cambia también los nombres en css/styles.css (--font y --font-title) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="wrap">

  <!-- ============ PERFIL ============ -->
  <header class="profile">
    <div class="avatar" id="avatar"><img id="avatarImg" alt="" width="64" height="64"><span id="avatarLetter"></span></div>
    <div class="profile__txt">
      <h1 class="name" id="name"></h1>
      <p class="role" id="role"></p>
      <p class="status" id="status"><i></i><span></span></p>
    </div>
  </header>

  <!-- ============ TITULAR + BOTÓN PRINCIPAL ============ -->
  <section class="hero">
    <h2 class="hero__title" id="title"></h2>
    <p class="hero__sub" id="sub"></p>
    <p class="rotor"><span id="rotorFixed"></span> <b class="rotor__word" id="rotorWord"></b></p>
    <a class="btn" id="ctaMain" href="#" target="_blank" rel="noopener">
      <svg class="ic"><use href="#i-whatsapp"/></svg><span>Escríbeme por WhatsApp</span>
    </a>
  </section>

  <!-- ============ DEMOS ============ -->
  <section class="stage" aria-labelledby="h-demos">
    <div class="stage__in">
      <div class="head"><h3 id="h-demos">Mira lo que he creado</h3></div>
      <div class="demos" id="demos" tabindex="0" aria-label="Demos de Web Pocket"></div>
    </div>
  </section>

  <!-- ============ QUÉ INCLUYE ============ -->
  <section class="block" aria-labelledby="h-inc">
    <div class="head"><h3 id="h-inc">Qué incluye tu Web Pocket</h3></div>
    <ul class="feats" id="feats"></ul>
  </section>

  <!-- ============ SECTORES ============ -->
  <section class="block" aria-labelledby="h-sec">
    <div class="head"><h3 id="h-sec"></h3></div>
    <p class="block__text" id="secText"></p>
    <ul class="tags" id="tags"></ul>
  </section>

  <!-- ============ REGALO ============ -->
  <section class="gift">
    <h3 id="giftTitle"></h3>
    <p id="giftText"></p>
    <ul class="gift__list" id="giftList"></ul>
    <a class="btn btn--ghost" id="ctaGift" href="#" target="_blank" rel="noopener"><span id="giftBtn"></span></a>
  </section>

  <!-- ============ SERVICIOS DEL ESTUDIO ============ -->
  <section class="block" aria-labelledby="h-serv">
    <div class="head"><h3 id="h-serv"></h3></div>
    <ul class="serv" id="serv"></ul>
  </section>

  <footer class="foot">
    <a class="foot__ig" id="ig" href="#" target="_blank" rel="noopener"><svg class="ic"><use href="#i-instagram"/></svg><span id="igName"></span></a>
    <p>© <span id="year"></span> Dani · Diseño de marca y web</p>
  </footer>
</main>

<!-- BOTÓN FLOTANTE (aparece al bajar un poco) -->
<a class="fab" id="fab" href="#" target="_blank" rel="noopener" aria-label="Escríbeme por WhatsApp"><svg class="ic"><use href="#i-whatsapp"/></svg><span>Escríbeme</span></a>

<!-- ÍCONOS (no tocar) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-whatsapp" viewBox="0 0 32 32"><path d="M16 4.5a11.4 11.4 0 0 0-9.9 17l-1.6 6 6.2-1.6A11.4 11.4 0 1 0 16 4.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 11c.4 4 3.4 7 7.6 8.6l1.6-1.8-2.4-1.4-1.1.9c-1.4-.6-2.5-1.7-3.1-3.1l.9-1.1L14.1 10 12 11Z" fill="currentColor"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-instagram" viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="7" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="22.8" cy="9.2" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-cubo" viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 0v9m0 0 8-4.5M12 12 4 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 10h8M8 13h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-tienda" viewBox="0 0 24 24"><path d="M3 4h2.4l2.1 10.2a1.6 1.6 0 0 0 1.6 1.3h8a1.6 1.6 0 0 0 1.6-1.2L20.4 8H6.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.2" r="1.3" fill="currentColor"/><circle cx="16.5" cy="19.2" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-marca" viewBox="0 0 24 24"><path d="M12 3.5 14.4 9l5.9.5-4.5 3.9 1.4 5.8L12 16.2 6.8 19.2l1.4-5.8L3.7 9.5 9.6 9 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-cohete" viewBox="0 0 24 24"><path d="M14 4c3.5.2 5.8 2.5 6 6-1.6 3.6-4.6 6.2-8 7l-5-5c.8-3.4 3.4-6.4 7-8ZM8.5 15.5 5 19m4-8-3.5.5M13 18l-.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14.6" cy="9.4" r="1.4" fill="currentColor"/></symbol>
</svg>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
